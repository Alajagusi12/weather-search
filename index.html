<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather • Search</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="home-page">

  <div class="home-container">
    <div class="home-card">
      <div class="home-header">
        <div class="logo">
          <span class="logo-icon">☁</span>
          <span class="logo-text">Weather</span>
        </div>
        <h1>What's the weather like?</h1>
        <p class="subtitle">Search any city or use your current location e.g Lagos, London, Abuja.</p>
      </div>

      <form id="searchForm" class="home-search">
        <div class="input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off" required>
        </div>
        <button type="submit" class="primary-btn">Search Weather</button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <button id="locationBtn" class="secondary-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
        </svg>
        Use my location
      </button>

      <div id="recentChips" class="recent-chips home-chips hidden"></div>
    </div>

    <p class="home-footer">@ Teslim Abdulwahab</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
